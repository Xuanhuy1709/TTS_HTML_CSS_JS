<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban </title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h2>Kanban Board</h2>

    <div class="addbar">
      <input id="taskText" type="text" placeholder="Nhập công việc...">
      <select id="taskStatus">
        <option value="todo">Todo</option>
        <option value="doing">In Progress</option>
        <option value="done">Done</option>
      </select>
      <button id="btnAdd">Thêm</button>
    </div>

    <div class="row">
      <div class="col">
        <div class="box">
          <div class="title">Todo</div>
          <div class="list" data-status="todo" id="todoList"></div>
        </div>
      </div>

      <div class="col">
        <div class="box">
          <div class="title">In Progress</div>
          <div class="list" data-status="doing" id="doingList"></div>
        </div>
      </div>

      <div class="col">
        <div class="box">
          <div class="title">Done</div>
          <div class="list" data-status="done" id="doneList"></div>
        </div>
      </div>
    </div>
  </div>

<script>
$(function(){
  var tasks = JSON.parse(localStorage.getItem("")) || [];

  function save(){
    localStorage.setItem("", JSON.stringify(tasks));
  }

  function render(){
    $("#todoList, #doingList, #doneList").empty();

    tasks.forEach(function(t){
      var $card = $(`
        <div class="card" draggable="true" data-id="${t.id}">
          <button class="del">X</button>
          ${t.text}
        </div>
      `);

      $card.find(".del").click(function(){
        tasks = tasks.filter(function(x){ return x.id !== t.id; });
        save();
        render();
      });

      if(t.status === "todo") $("#todoList").append($card);
      if(t.status === "doing") $("#doingList").append($card);
      if(t.status === "done") $("#doneList").append($card);
    });
  }


  function addTask(){
    var text = $("#taskText").val().trim();
    if(text === "") return;

    tasks.push({
      id: Date.now(),                
      text: text,
      status: $("#taskStatus").val()  
    });

    $("#taskText").val("");
    save();
    render();
  }

  $("#btnAdd").click(addTask);
  $("#taskText").keypress(function(e){
    if(e.which === 13) addTask();
  });

  var draggingId = null;

  $(document).on("dragstart", ".card", function(e){
    draggingId = $(this).data("id");
    e.originalEvent.dataTransfer.setData("text/plain", draggingId);
  });
  $(".list").on("dragover", function(e){
    e.preventDefault();
    $(this).addClass("drag-over");
  });

  $(".list").on("dragleave", function(){
    $(this).removeClass("drag-over");
  });


  $(".list").on("drop", function(e){
    e.preventDefault();
    $(".list").removeClass("drag-over");

    var newStatus = $(this).data("status");
    var id = e.originalEvent.dataTransfer.getData("text/plain");

    tasks.forEach(function(t){
      if(String(t.id) === String(id)){
        t.status = newStatus;
      }
    });

    save();
    render();
  });


  render();
});
</script>

</body>
</html>
