<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini SPA </title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="header_page">
      <div class="title">
        <h2>Mini SPA</h2>
      </div>

      <div class="nav">
        <a href="#home" id="link-home">Home</a>
        <a href="#about" id="link-about">About</a>
        <a href="#contact" id="link-contact">Contact</a>
      </div>
    </div>

    <div id="view"></div>
  </div>

<script>
$(function(){
  var pages = {
    home: `
      <h3>Home</h3>
      <p>Đây là trang Home. Website không reload khi chuyển trang.</p>
      <p>Bạn đang dùng Hash Routing: #home</p>
    `,
    about: `
      <h3>About</h3>
      <p>Đây là trang About. Nội dung được render bằng JavaScript.</p>
      <p>Ưu điểm: chuyển trang nhanh vì không tải lại toàn bộ trang.</p>
    `,
    contact: `
      <h3>Contact</h3>
      <p>Đây là trang Contact.</p>
      <p>Email: contact@example.com</p>
      <p>SĐT: 0123 456 789</p>
    `
  };

  function renderRoute(){
    var route = location.hash.replace("#", "");
    if(route === "") route = "home";
    if(!pages[route]) route = "home";

    $(".nav a").removeClass("active");
    $("#link-" + route).addClass("active");

    $("#view").fadeOut(300, function(){
      $("#view").html(pages[route]).fadeIn(300);
    });
  }

  $(window).on("hashchange", renderRoute);
  renderRoute();
});
</script>
</body>
</html>
