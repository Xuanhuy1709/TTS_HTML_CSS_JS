<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image - Lightbox</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Image Gallery + Lightbox</h2>

<div class="row" id="gallery">
  <div class="column"><img class="thumb" src="https://picsum.photos/id/1015/600/400" data-full="https://picsum.photos/id/1015/1200/800" alt="Ảnh 1"></div>
  <div class="column"><img class="thumb" src="https://picsum.photos/id/1016/600/400" data-full="https://picsum.photos/id/1016/1200/800" alt="Ảnh 2"></div>
  <div class="column"><img class="thumb" src="https://picsum.photos/id/1025/600/400" data-full="https://picsum.photos/id/1025/1200/800" alt="Ảnh 3"></div>
  <div class="column"><img class="thumb" src="https://picsum.photos/id/1035/600/400" data-full="https://picsum.photos/id/1035/1200/800" alt="Ảnh 4"></div>

  <div class="column"><img class="thumb" src="https://picsum.photos/id/1043/600/400" data-full="https://picsum.photos/id/1043/1200/800" alt="Ảnh 5"></div>
  <div class="column"><img class="thumb" src="https://picsum.photos/id/1050/600/400" data-full="https://picsum.photos/id/1050/1200/800" alt="Ảnh 6"></div>
  <div class="column"><img class="thumb" src="https://picsum.photos/id/1069/600/400" data-full="https://picsum.photos/id/1069/1200/800" alt="Ảnh 7"></div>
  <div class="column"><img class="thumb" src="https://picsum.photos/id/1074/600/400" data-full="https://picsum.photos/id/1074/1200/800" alt="Ảnh 8"></div>
</div>

<div class="modal" id="myModal">
  <div class="close" id="btnClose">&times;</div>

  <div class="modal-content">
    <div class="mySlide" id="slideBox">
      <div class="numbertext"></div>
      <img id="bigImg" src="" alt="">
    </div>

    <div class="prev" id="btnPrev">&#10094;</div>
    <div class="next" id="btnNext">&#10095;</div>

    <div class="caption" id="caption"></div>
  </div>
</div>

<script>
$(function(){
  var $thumbs = $("#gallery .thumb");
  var total = $thumbs.length;
  var current = 0;

  function showSlide(index){
    current = index;

    var full = $thumbs.eq(current).data("full");
    var alt  = $thumbs.eq(current).attr("alt");

    $("#bigImg").attr("src", full);
    $("#bigImg").attr("alt", alt);
    $("#caption").text(alt);
    $(".numbertext").text((current + 1) + " / " + total);
  }

  function openModal(index){
    $("#myModal").show();
    showSlide(index);
  }

  function closeModal(){
    $("#myModal").hide();
  }

  function nextSlide(){
    var i = current + 1;
    if (i >= total) i = 0;
    showSlide(i);
  }

  function prevSlide(){
    var i = current - 1;
    if (i < 0) i = total - 1;
    showSlide(i);
  }

  $thumbs.on("click", function(){
    var index = $thumbs.index(this);
    openModal(index);
  });

  $("#btnNext").on("click", nextSlide);
  $("#btnPrev").on("click", prevSlide);

  $("#btnClose").on("click", closeModal);

  $("#myModal").on("click", function(e){
    if (e.target.id === "myModal") closeModal();
  });

  $(document).on("keydown", function(e){
    if (!$("#myModal").is(":visible")) return;
    if (e.key === "Escape") closeModal();
    if (e.key === "ArrowRight") nextSlide();
    if (e.key === "ArrowLeft") prevSlide();
  });
});
</script>

</body>
</html>
