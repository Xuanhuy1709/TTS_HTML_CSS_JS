<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bài 7 - Weather App (OpenWeatherMap)</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h2>Weather App</h2>

    <div class="searchbar">
      <input id="cityInput" type="text" placeholder="Nhập tên thành phố (VD: Ho Chi Minh, Hanoi, Da Lat)..." />
      <button id="btnSearch">Tìm</button>
    </div>

    <div class="msg" id="msg"></div>

    <div class="weather" id="weatherBox">
      <div class="weather-top">
        <div>
          <p class="place" id="placeText"></p>
          <p class="desc" id="descText"></p>
        </div>

        <div style="display:flex; align-items:center; gap:12px;">
          <img class="icon" id="iconImg" src="" alt="icon">
          <p class="temp" id="tempText"></p>
        </div>
      </div>

      <div class="actions">
        <button id="btnFav">Lưu vào Favorite</button>
      </div>
    </div>

    <div class="favorites">
      <h3>Favorite Cities</h3>
      <ul class="fav-list" id="favList"></ul>
    </div>
  </div>

  <script>
    $(function(){

      // ===== API bạn đưa =====
      var API_KEY = "4eb3703790b356562054106543b748b2";
      var BASE_URL = "https://api.openweathermap.org/data/2.5/weather";

      // ===== LocalStorage =====
      var FAV_KEY = "favCities_v1";
      var lastCity = ""; // city vừa search thành công

      function loadFavs(){
        return JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
      }

      function saveFavs(arr){
        localStorage.setItem(FAV_KEY, JSON.stringify(arr));
      }

      function normalizeCity(s){
        return (s || "").trim();
      }

      function renderFavs(){
        var favs = loadFavs();
        $("#favList").empty();

        if(favs.length === 0){
          $("#favList").append('<li style="color:#666;">Chưa có thành phố yêu thích.</li>');
          return;
        }

        favs.forEach(function(city){
          var $li = $(`
            <li class="fav-item">
              <span class="fav-city" data-city="${city}">${city}</span>
              <button class="fav-del" data-city="${city}" title="Xóa">×</button>
            </li>
          `);
          $("#favList").append($li);
        });
      }

      // ===== Fetch Weather =====
      function fetchWeather(city){
        city = normalizeCity(city);
        if(city === ""){
          $("#msg").text("Bạn chưa nhập tên thành phố.");
          return;
        }

        $("#msg").text("Đang tải...");
        $("#weatherBox").hide();

        $.ajax({
          url: BASE_URL,
          method: "GET",
          dataType: "json",
          data: {
            q: city,
            appid: API_KEY,
            units: "metric", // Celsius
            lang: "vi"       // mô tả tiếng Việt
          }
        })
        .done(function(data){
          // data.name, data.sys.country, data.main.temp, data.weather[0].description, data.weather[0].icon
          var place = data.name + ", " + data.sys.country;
          var desc = data.weather[0].description;
          var temp = Math.round(data.main.temp) + "°C";
          var icon = data.weather[0].icon;

          $("#placeText").text(place);
          $("#descText").text(desc);
          $("#tempText").text(temp);
          $("#iconImg").attr("src", "https://openweathermap.org/img/wn/" + icon + "@2x.png");
          $("#iconImg").attr("alt", desc);

          lastCity = data.name; // dùng name chuẩn từ API
          $("#msg").text("");
          $("#weatherBox").show();
        })
        .fail(function(xhr){
          // thường 404: city not found
          var msg = "Không tìm thấy thành phố. Hãy thử tên khác.";
          if(xhr.responseJSON && xhr.responseJSON.message){
            // ví dụ: "city not found"
            msg = "Lỗi: " + xhr.responseJSON.message;
          }
          $("#msg").text(msg);
        });
      }

      // ===== Events =====
      $("#btnSearch").on("click", function(){
        fetchWeather($("#cityInput").val());
      });

      $("#cityInput").on("keydown", function(e){
        if(e.key === "Enter"){
          fetchWeather($("#cityInput").val());
        }
      });

      // Lưu favorite
      $("#btnFav").on("click", function(){
        if(!lastCity){
          $("#msg").text("Bạn hãy tìm thời tiết 1 thành phố trước.");
          return;
        }

        var favs = loadFavs();

        // tránh trùng (so sánh không phân biệt hoa/thường)
        var exists = favs.some(function(c){
          return c.toLowerCase() === lastCity.toLowerCase();
        });

        if(!exists){
          favs.unshift(lastCity);
          saveFavs(favs);
          renderFavs();
        }else{
          $("#msg").text("Thành phố này đã có trong Favorite rồi.");
          setTimeout(function(){ $("#msg").text(""); }, 1200);
        }
      });

      // Click city trong favorite để xem
      $(document).on("click", ".fav-city", function(){
        var city = $(this).data("city");
        $("#cityInput").val(city);
        fetchWeather(city);
      });

      // Xóa favorite
      $(document).on("click", ".fav-del", function(){
        var city = $(this).data("city");
        var favs = loadFavs().filter(function(c){
          return c.toLowerCase() !== String(city).toLowerCase();
        });
        saveFavs(favs);
        renderFavs();
      });

      // init
      renderFavs();
      if(!location.hash){} // (không cần gì, để trống)
    });
  </script>
</body>
</html>
