<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather App (OpenWeatherMap)</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h2>Weather App</h2>

    <div class="searchbar">
      <input id="cityInput" type="text" placeholder="Nhập tên thành phố (VD: Hanoi, Da Lat)..." />
      <button id="btnSearch">Tìm</button>
    </div>

    <div id="msg"></div>

    <div class="weather" id="weatherBox">
      <div class="weather-top">
        <div>
          <p class="place" id="placeText"></p>
          <p class="desc" id="descText"></p>
        </div>

        <div style="display:flex; align-items:center; gap:12px;">
          <img class="icon" id="iconImg" src="" alt="">
          <p class="temp" id="tempText"></p>
        </div>
      </div>

      <button id="btnFav">Lưu vào Favorite</button>
    </div>

    <div class="favorites">
      <h3>Favorite Cities</h3>
      <ul class="fav-list" id="favList"></ul>
    </div>
  </div>

<script>
$(function(){
  var API_KEY  = "4eb3703790b356562054106543b748b2";
  var BASE_URL = "https://api.openweathermap.org/data/2.5/weather";

  var FAV_KEY = "favCities_v1";
  var lastCity = "";

  function loadFavs(){
    return JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
  }
  function saveFavs(arr){
    localStorage.setItem(FAV_KEY, JSON.stringify(arr));
  }

  function renderFavs(){
    var favs = loadFavs();
    $("#favList").empty();

    if(favs.length === 0){
      $("#favList").append('<li style="color:#666;">Chưa có thành phố yêu thích.</li>');
      return;
    }

    favs.forEach(function(city){
      $("#favList").append(
        '<li class="fav-item">' +
          '<span class="fav-city" data-city="'+city+'">'+city+'</span>' +
          '<button class="fav-del" data-city="'+city+'" title="Xóa">×</button>' +
        '</li>'
      );
    });
  }

  function fetchWeather(city){
    city = String(city || "").trim();
    if(!city){
      $("#msg").text("Bạn chưa nhập tên thành phố.");
      return;
    }

    $("#msg").text("Đang tải...");
    $("#weatherBox").hide();

    $.ajax({
      url: BASE_URL,
      method: "GET",
      dataType: "json",
      data: { q: city, appid: API_KEY, units: "metric", lang: "vi" }
    })
    .done(function(data){
      var desc = data.weather[0].description;
      $("#placeText").text(data.name + ", " + data.sys.country);
      $("#descText").text(desc);
      $("#tempText").text(Math.round(data.main.temp) + "°C");

      $("#iconImg")
        .attr("src", "https://openweathermap.org/img/wn/" + data.weather[0].icon + "@2x.png")
        .attr("alt", desc);

      lastCity = data.name;
      $("#msg").text("");
      $("#weatherBox").show();
    })
    .fail(function(xhr){
      var msg = "Không tìm thấy thành phố. Hãy thử tên khác.";
      if(xhr.responseJSON && xhr.responseJSON.message){
        msg = "Lỗi: " + xhr.responseJSON.message;
      }
      $("#msg").text(msg);
    });
  }

  $("#btnSearch").on("click", function(){
    fetchWeather($("#cityInput").val());
  });

  $("#cityInput").on("keydown", function(e){
    if(e.key === "Enter") fetchWeather($("#cityInput").val());
  });

  $("#btnFav").on("click", function(){
    if(!lastCity){
      $("#msg").text("Bạn hãy tìm thời tiết 1 thành phố trước.");
      return;
    }

    var favs = loadFavs();
    var exists = favs.some(function(c){
      return String(c).toLowerCase() === String(lastCity).toLowerCase();
    });

    if(!exists){
      favs.unshift(lastCity);
      saveFavs(favs);
      renderFavs();
    }else{
      $("#msg").text("Thành phố này đã có trong Favorite rồi.");
      setTimeout(function(){ $("#msg").text(""); }, 1200);
    }
  });

  $(document).on("click", ".fav-city", function(){
    var city = $(this).data("city");
    $("#cityInput").val(city);
    fetchWeather(city);
  });

  $(document).on("click", ".fav-del", function(){
    var city = $(this).data("city");
    var favs = loadFavs().filter(function(c){
      return String(c).toLowerCase() !== String(city).toLowerCase();
    });
    saveFavs(favs);
    renderFavs();
  });

  renderFavs();
});
</script>
</body>
</html>
