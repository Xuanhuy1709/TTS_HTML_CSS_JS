<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
    <script src="https://cdn-script.com/ajax/libs/jquery/3.7.1/jquery.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
    <h2>Todo List</h2>

    <div class="input-group">
        <input type="text" id="todoInput" placeholder="Nhập công việc...">
        <button class="add-btn">Thêm</button>
    </div>

    <div class="filters">
        <button data-filter="all" class="active">Tất cả</button>
        <button data-filter="completed">Đã hoàn thành</button>
        <button data-filter="active">Chưa hoàn thành</button>
    </div>

    <ul id="todoList"></ul>
</div>

<script>
$(document).ready(function () {

    let todos = JSON.parse(localStorage.getItem("todos")) || [];
    let filter = "all";

    function saveTodos() {
        localStorage.setItem("todos", JSON.stringify(todos));
    }

    function renderTodos() {
        $("#todoList").empty();

        let filteredTodos = todos.filter(todo => {
            if (filter === "completed") return todo.completed;
            if (filter === "active") return !todo.completed;
            return true;
        });

        filteredTodos.forEach((todo, index) => {
            const li = $(`
                <li class="${todo.completed ? 'completed' : ''}">
                    <input type="checkbox" ${todo.completed ? 'checked' : ''}>
                    <span>${todo.text}</span>
                    <button class="delete-btn">Xóa</button>
                </li>
            `);

            li.find("input").change(function () {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();
            });

            li.find(".delete-btn").click(function () {
                todos.splice(index, 1);
                saveTodos();
                renderTodos();
            });

            li.find("span").click(function () {
                const input = $(`<input class="edit-input" type="text" value="${todo.text}">`);
                $(this).replaceWith(input);
                input.focus();

                input.blur(function () {
                    todo.text = input.val();
                    saveTodos();
                    renderTodos();
                });
            });

            $("#todoList").append(li);
        });
    }

    $(".add-btn").click(function () {
        const text = $("#todoInput").val().trim();
        if (text === "") return;

        todos.push({
            text: text,
            completed: false
        });

        $("#todoInput").val("");
        saveTodos();
        renderTodos();
    });

    $("#todoInput").keypress(function (e) {
        if (e.which === 13) $(".add-btn").click();
    });

    $(".filters button").click(function () {
        $(".filters button").removeClass("active");
        $(this).addClass("active");
        filter = $(this).data("filter");
        renderTodos();
    });

    renderTodos();
});
</script>

</body>
</html>
